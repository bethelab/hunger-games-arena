services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hunger_games_arena
    ports:
      - "${VITE_PORT:-3000}:3000"
    environment:
      - VITE_PORT=3000
      - VITE_HOST=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      # Mount current directory into container for live hot reloading
      - .:/app
      # Keep node_modules isolated inside container to avoid host OS conflict
      - /app/node_modules
    restart: unless-stopped
